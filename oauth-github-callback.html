<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting to GitHub…</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 24px;
            padding: 32px;
        }

        .gh-mark svg { width: 52px; height: 52px; fill: #e6edf3; }

        .spinner-wrap {
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid #30363d;
            border-top-color: #238636;
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        h2 { font-size: 1.1rem; font-weight: 600; color: #e6edf3; }
        p  { font-size: .85rem; color: #7d8590; text-align: center; max-width: 300px; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(35,134,54,.12);
            border: 1px solid rgba(35,134,54,.35);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: .8rem; color: #3fb950;
            opacity: 0; transform: translateY(6px);
            transition: opacity .4s, transform .4s;
        }
        .status-badge.show { opacity: 1; transform: translateY(0); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; animation: pulse 1.2s ease infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* Error state */
        .error-card {
            display: none;
            background: rgba(248,81,73,.08);
            border: 1px solid rgba(248,81,73,.35);
            border-radius: 12px;
            padding: 20px 24px;
            text-align: center;
            max-width: 340px;
        }
        .error-card h2 { color: #f85149; margin-bottom: 8px; }
        .error-card p  { color: #7d8590; margin-bottom: 16px; }
        .retry-btn {
            background: #21262d; border: 1px solid #30363d;
            border-radius: 6px; padding: 8px 20px;
            color: #e6edf3; font-size: .875rem; cursor: pointer;
            font-family: inherit;
        }
        .retry-btn:hover { background: #30363d; }
    </style>
</head>
<body>

    <div class="gh-mark">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
    </div>

    <div class="spinner-wrap" id="loadingSection">
        <div class="spinner"></div>
        <h2 id="statusText">Authenticating with GitHub…</h2>
        <p id="statusSub">Please wait while we securely connect your account.</p>
    </div>

    <div class="status-badge" id="successBadge">
        <div class="dot"></div>
        Connected successfully
    </div>

    <div class="error-card" id="errorCard">
        <h2>Authentication failed</h2>
        <p id="errorMsg">Something went wrong. Please close this window and try again.</p>
        <button class="retry-btn" onclick="window.close()">Close Window</button>
    </div>

<script>
    (async function () {
        const params  = new URLSearchParams(window.location.search);
        const code    = params.get("code");
        const state   = params.get("state");
        const error   = params.get("error");

        // Decode role from state param
        let role = "employee";
        try {
            const decoded = atob(state || "");
            role = decoded.split(":")[0] || "employee";
        } catch (_) {}

        if (error || !code) {
            showError(error === "access_denied"
                ? "You cancelled the GitHub sign-in."
                : "GitHub returned an error: " + (error || "missing code"));
            return;
        }

        // ── Exchange code for token via our Netlify function ─────────────
        // The function keeps GITHUB_CLIENT_SECRET safely on the server.
        updateStatus("Exchanging authorization code…", "Securing your session…");

        let ghUser = null;
        try {
            const fnUrl = window.location.origin + "/api/github-oauth";
            const redirectUri = window.location.href.split("?")[0];

            const res = await fetch(fnUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ code, redirectUri })
            });

            if (res.ok) {
                const data = await res.json();
                if (!data.error) ghUser = data;
            }
        } catch (fetchErr) {
            console.warn("Netlify function call failed:", fetchErr);
        }


        // Fallback: use what we can infer (GitHub username from code isn't possible,
        // so we set a placeholder that the user can update in their profile)
        const userData = {
            name:   ghUser ? (ghUser.name   || ghUser.login) : "GitHub User",
            email:  ghUser ? (ghUser.email  || ghUser.login + "@github.com") : "github-user@github.com",
            avatar: ghUser ? (ghUser.name   || ghUser.login || "G")[0].toUpperCase() : "G",
            handle: ghUser ? ghUser.login   : "github-user",
            picture: ghUser ? ghUser.avatar_url : null
        };

        // ── Notify parent window ──────────────────────────────────────────
        updateStatus("Connected!", "Redirecting you to BenchBridge…");
        document.getElementById("successBadge").classList.add("show");
        document.getElementById("loadingSection").style.opacity = "0.4";

        setTimeout(() => {
            if (window.opener) {
                window.opener.postMessage(
                    { type: "GITHUB_OAUTH_SUCCESS", user: { ...userData, role } },
                    "*"
                );
                window.close();
            } else {
                // If opened directly (not as popup), redirect to login
                window.location.replace("login.html");
            }
        }, 1200);
    })();

    function updateStatus(title, sub) {
        const t = document.getElementById("statusText");
        const s = document.getElementById("statusSub");
        if (t) t.textContent = title;
        if (s) s.textContent = sub;
    }

    function showError(msg) {
        document.getElementById("loadingSection").style.display = "none";
        const card = document.getElementById("errorCard");
        card.style.display = "block";
        document.getElementById("errorMsg").textContent = msg;
    }
</script>

</body>
</html>
