<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BenchBridge — Technical Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1A1A;
    --panel:#282828;
    --panel-2:#333333;
    --panel-3:#3E3E3E;
    --border:rgba(255, 255, 255, 0.08);
    --border-soft:rgba(255, 255, 255, 0.05);
    --text:#EFF1F6;
    --text-dim:#909296;
    --text-faint:#595959;
    --accent:#007AFF;
    --accent-dim:rgba(0, 122, 255, 0.15);
    --success:#2CBB5D;
    --success-dim:rgba(44, 187, 93, 0.15);
    --danger:#EF4743;
    --danger-dim:rgba(239, 71, 67, 0.15);
    --amber:#FFA116;
    --amber-dim:rgba(255, 161, 22, 0.15);
    --java:#FFA116;
    --python:#3776AB;
    --sql:#00758F;
    --radius:8px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
  code, .mono, textarea.editor, .test-io{font-family:'JetBrains Mono', 'Fira Code', 'Menlo', 'Consolas', monospace;}
  button{font-family:inherit; cursor:pointer; border:none;}
  ::selection{background:rgba(255, 161, 22, 0.3); color:#fff;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(255, 255, 255, 0.16); border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255, 255, 255, 0.28);}

  /* ---------- Screens ---------- */
  .screen{display:none; min-height:100vh;}
  .screen.active{display:block;}
  #assessment.active{display:flex; height:100vh; overflow:hidden; background:#1A1A1A;}

  /* ---------- LANDING SCREEN ---------- */
  #landing{
    display:flex; flex-direction:column; align-items:center;
    padding:64px 24px 80px;
    background:var(--bg);
  }
  .landing-inner{width:100%; max-width:920px;}
  .eyebrow{
    display:flex; align-items:center; gap:10px;
    color:var(--amber); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    font-weight:700; margin-bottom:18px;
  }
  .eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--amber); box-shadow:0 0 10px var(--amber);}
  .landing-title{font-size:38px; line-height:1.15; font-weight:700; letter-spacing:-0.02em; margin-bottom:14px; color:#fff;}
  .landing-sub{color:var(--text-dim); font-size:15px; max-width:560px; line-height:1.6; margin-bottom:44px;}

  .rules-strip{
    display:flex; gap:28px; flex-wrap:wrap;
    padding:18px 22px; border:1px solid var(--border); border-radius:12px;
    background:var(--panel); margin-bottom:48px;
  }
  .rule-item{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-dim);}
  .rule-item b{color:var(--text); font-weight:600;}
  .rule-icon{width:28px; height:28px; border-radius:6px; background:var(--panel-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--amber); font-size:13px;}

  .track-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  @media(max-width:820px){.track-grid{grid-template-columns:1fr;}}

  .track-card{
    position:relative; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:24px 20px 20px; text-align:left; overflow:hidden;
    transition:all .18s ease;
  }
  .track-card:hover{border-color:rgba(255, 255, 255, 0.2); transform:translateY(-2px); background:#2D2D2D;}
  .track-badge{
    width:40px; height:40px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:var(--panel-2);
    color:var(--amber); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px;
    margin-bottom:16px; border:1px solid var(--border);
  }
  .track-name{font-size:18px; font-weight:700; margin-bottom:6px; color:#fff;}
  .track-desc{font-size:13px; color:var(--text-dim); line-height:1.55; margin-bottom:20px; min-height:40px;}
  .track-meta{display:flex; gap:14px; font-size:11.5px; color:var(--text-dim); margin-bottom:20px; font-weight:500;}
  .track-start{
    width:100%; padding:10px 0; border-radius:6px; background:rgba(255, 255, 255, 0.08); color:#fff;
    font-weight:600; font-size:13px; border:1px solid rgba(255, 255, 255, 0.1); transition:all .15s ease;
  }
  .track-card:hover .track-start{background:var(--amber); color:#1A1A1A; border-color:var(--amber);}

  /* ---------- LEETCODE TOPBAR ---------- */
  #assessment{display:none; flex-direction:column; height:100vh;}
  #assessment.active{display:flex;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; height:48px; flex-shrink:0;
    background:#282828; border-bottom:1px solid rgba(255, 255, 255, 0.08);
  }
  .topbar-left{display:flex; align-items:center; gap:12px;}
  .brand{font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px; color:#FFA116; letter-spacing:-0.01em;}
  .brand-dot{width:14px; height:14px; background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23FFA116"><path d="M16.102 17.93l-2.697 2.607c-.466.45-1.235.45-1.702 0l-4.52-4.368a1.246 1.246 0 010-1.74l4.52-4.368c.467-.451 1.236-.451 1.702 0l2.697 2.607a.9.9 0 001.273-1.273l-2.697-2.607a3.047 3.047 0 00-4.248 0l-4.52 4.368a3.045 3.045 0 000 4.286l4.52 4.368a3.047 3.047 0 004.248 0l2.697-2.607a.9.9 0 00-1.273-1.273z"/></svg>') center/contain no-repeat;}
  .topic-pill{
    display:flex; align-items:center; gap:6px; padding:4px 10px; border-radius:14px;
    background:rgba(255, 255, 255, 0.06); border:1px solid rgba(255, 255, 255, 0.08); font-size:12px; color:#EFF1F6; font-weight:600;
  }
  .topic-pill .swatch{width:6px; height:6px; border-radius:50%; background:var(--amber);}

  .timer-box{
    display:flex; align-items:center; gap:8px; padding:4px 12px; border-radius:14px;
    background:rgba(255, 255, 255, 0.05); border:1px solid rgba(255, 255, 255, 0.08);
  }
  .timer-box.low{border-color:var(--danger); background:var(--danger-dim);}
  .timer-label{font-size:11px; color:var(--text-dim); font-weight:500;}
  .timer-val{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:600; color:#EFF1F6;}
  .timer-box.low .timer-val{color:var(--danger);}

  .topbar-right{display:flex; align-items:center; gap:10px;}
  .btn-submit-all{
    padding:6px 16px; border-radius:6px; background:#007AFF; color:#fff; font-weight:600; font-size:12.5px;
    transition:background .15s ease;
  }
  .btn-submit-all:hover{background:#0062CC;}

  .assess-body{flex:1; display:flex; min-height:0; background:#1A1A1A; padding:6px; gap:6px;}

  /* ---------- LEETCODE LEFT PANEL (sidebar + question) ---------- */
  .qsidebar{
    width:210px; flex-shrink:0; background:#282828; border-radius:8px;
    border:1px solid rgba(255, 255, 255, 0.06); padding:12px 10px; overflow-y:auto;
  }
  .qsidebar-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); font-weight:700; margin:0 4px 10px;}
  .qnav-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px; margin-bottom:4px;
    color:var(--text-dim); font-size:12.5px; font-weight:500; transition:all .12s ease; cursor:pointer;
  }
  .qnav-item:hover{background:rgba(255, 255, 255, 0.06); color:#fff;}
  .qnav-item.active{background:rgba(255, 255, 255, 0.1); color:#fff; font-weight:600;}
  .qnav-status{width:16px; height:16px; border-radius:4px; border:1px solid rgba(255, 255, 255, 0.15); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim);}
  .qnav-status.passed{background:var(--success-dim); border-color:var(--success); color:var(--success);}
  .qnav-status.attempted{background:var(--danger-dim); border-color:var(--danger); color:var(--danger);}

  .sidebar-divider{height:1px; background:rgba(255, 255, 255, 0.06); margin:14px 4px;}
  .score-summary{padding:2px 4px; font-size:11.5px; color:var(--text-dim);}
  .score-summary b{color:#fff; font-size:18px; font-weight:700; display:block; margin-bottom:2px;}

  /* main split */
  .assess-main{flex:1; display:flex; min-width:0; gap:6px;}
  .question-pane{
    width:48%; flex-shrink:0; overflow-y:auto; padding:20px 22px 40px;
    background:#282828; border-radius:8px; border:1px solid rgba(255, 255, 255, 0.06);
  }
  .q-head{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .q-difficulty{
    font-size:12px; font-weight:600; padding:2px 8px; border-radius:12px;
    background:rgba(239, 71, 67, 0.15); color:#FF4D4D;
  }
  .q-index{font-size:12px; color:var(--text-dim); font-weight:500;}
  .q-title{font-size:20px; font-weight:700; margin-bottom:14px; color:#fff; letter-spacing:-0.01em;}
  .q-desc{font-size:13.5px; line-height:1.7; color:#EFF1F6; margin-bottom:20px; white-space:pre-line;}
  .q-desc b, .q-desc strong{color:#fff; font-weight:600;}

  .q-section-title{font-size:12px; font-weight:700; color:#fff; margin:20px 0 8px;}
  .example-block{
    background:#1A1A1A; border:1px solid rgba(255, 255, 255, 0.06); border-radius:8px; padding:12px 14px; margin-bottom:10px;
  }
  .example-block .ex-label{font-size:11.5px; color:var(--text-dim); font-weight:600; margin-bottom:6px;}
  .example-block pre{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#EFF1F6; white-space:pre-wrap; word-break:break-word; line-height:1.6;}
  .constraints-list{font-size:12.5px; color:var(--text-dim); line-height:1.8; padding-left:16px;}
  .constraints-list code{background:rgba(255, 255, 255, 0.08); padding:1px 5px; border-radius:4px; font-size:12px; color:#fff;}

  /* ---------- LEETCODE EDITOR PANE ---------- */
  .editor-pane{flex:1; display:flex; flex-direction:column; min-width:0; background:#282828; border-radius:8px; border:1px solid rgba(255, 255, 255, 0.06); overflow:hidden;}
  .editor-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; border-bottom:1px solid rgba(255, 255, 255, 0.06); background:#282828;
  }
  .lang-tag{display:flex; align-items:center; gap:6px; font-size:12px; color:#EFF1F6; font-weight:600; background:rgba(255, 255, 255, 0.06); padding:4px 10px; border-radius:6px;}
  .lang-tag .swatch{width:6px; height:6px; border-radius:50%; background:var(--amber);}
  .toolbar-actions{display:flex; gap:8px;}
  .btn{
    padding:5px 12px; border-radius:6px; font-size:12px; font-weight:600;
    background:rgba(255, 255, 255, 0.08); color:#EFF1F6; border:1px solid rgba(255, 255, 255, 0.08); transition:all .12s ease;
  }
  .btn:hover{background:rgba(255, 255, 255, 0.14); color:#fff;}
  .btn.primary{background:rgba(255, 255, 255, 0.08); color:#EFF1F6; border-color:rgba(255, 255, 255, 0.1);}
  .btn.primary:hover{background:rgba(255, 255, 255, 0.14);}
  .btn.success{background:#2CBB5D; color:#fff; border-color:#2CBB5D;}
  .btn.success:hover{background:#269E4F;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn .spinner{display:inline-block; width:11px; height:11px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; margin-right:6px; vertical-align:-1px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  textarea.editor{
    flex:1; width:100%; background:#1A1A1A; color:#EFF1F6; border:none; outline:none; resize:none;
    padding:16px 18px; font-size:13px; line-height:1.6; tab-size:4;
  }

  .results-panel{
    height:220px; flex-shrink:0; border-top:1px solid rgba(255, 255, 255, 0.06); background:#282828;
    display:flex; flex-direction:column;
  }
  .results-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 14px; border-bottom:1px solid rgba(255, 255, 255, 0.06); background:#282828;
  }
  .results-title{font-size:12px; font-weight:600; color:#EFF1F6;}
  .results-verdict{font-size:12px; font-weight:600;}
  .results-body{flex:1; overflow-y:auto; padding:10px 14px; background:#1A1A1A;}
  .results-empty{color:var(--text-dim); font-size:12.5px; padding:18px 0; text-align:center;}

  .tc-row{
    border:1px solid rgba(255, 255, 255, 0.06); border-radius:6px; margin-bottom:8px; overflow:hidden; background:#282828;
  }
  .tc-head{display:flex; align-items:center; gap:8px; padding:8px 12px; font-size:12px; font-weight:600;}
  .tc-status-icon{width:14px; height:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; flex-shrink:0;}
  .tc-status-icon.pass{background:var(--success-dim); color:var(--success);}
  .tc-status-icon.fail{background:var(--danger-dim); color:var(--danger);}
  .tc-status-icon.pending{background:var(--panel-2); border:1px dashed var(--border); color:var(--text-dim);}
  .tc-lock{margin-left:auto; color:var(--text-dim); font-size:11px;}
  .tc-detail{padding:8px 12px; font-size:12px; display:none; background:#1A1A1A; border-top:1px solid rgba(255, 255, 255, 0.04);}
  .tc-detail.show{display:block;}
  .tc-io-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px;}
  .tc-io-block .tc-io-label{color:var(--text-dim); font-size:10.5px; font-weight:600; margin-bottom:4px;}
  .test-io{background:#282828; border:1px solid rgba(255, 255, 255, 0.06); border-radius:6px; padding:6px 10px; font-size:12px; color:#EFF1F6; white-space:pre-wrap; word-break:break-word; max-height:80px; overflow-y:auto;}

  /* ---------- RESULTS SCREEN ---------- */
  #resultsScreen{display:none; align-items:center; justify-content:center; min-height:100vh; padding:40px 20px;}
  #resultsScreen.active{display:flex;}
  .results-card{width:100%; max-width:640px; background:var(--panel); border:1px solid var(--border-soft); border-radius:16px; padding:44px 40px;}
  .results-card .icon{width:56px; height:56px; border-radius:14px; background:var(--success-dim); border:1px solid rgba(53,208,140,.35); display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--success); margin-bottom:22px;}
  .results-card h2{font-size:24px; margin-bottom:8px;}
  .results-card p.sub{color:var(--text-dim); font-size:14px; margin-bottom:28px;}
  .score-big{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
  .score-big .num{font-family:'Space Grotesk',sans-serif; font-size:48px; font-weight:700;}
  .score-big .denom{font-size:18px; color:var(--text-faint);}
  .score-bar{height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden; margin-bottom:28px;}
  .score-bar-fill{height:100%; background:var(--success); border-radius:5px; transition:width .6s ease;}
  .breakdown-row{display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--border-soft); font-size:13.5px;}
  .breakdown-row:last-of-type{border-bottom:1px solid var(--border-soft);}
  .breakdown-q{color:var(--text-dim);}
  .breakdown-tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:5px;}
  .breakdown-tag.full{background:var(--success-dim); color:var(--success);}
  .breakdown-tag.partial{background:rgba(255,176,32,.14); color:var(--amber);}
  .breakdown-tag.zero{background:var(--danger-dim); color:var(--danger);}
  .results-actions{margin-top:28px; display:flex; gap:10px;}

  .banner{
    display:none; align-items:center; gap:10px; padding:12px 16px; border-radius:8px;
    background:rgba(255,176,32,.1); border:1px solid rgba(255,176,32,.3); color:var(--amber); font-size:13px; margin-bottom:18px;
  }
  .banner.show{display:flex;}

  @media(max-width:900px){
    .qsidebar{display:none;}
    .assess-main{flex-direction:column;}
    .question-pane, .editor-pane{width:100%;}
    .question-pane{max-height:38vh; border-right:none; border-bottom:1px solid var(--border-soft);}
  }
</style>
</head>
<body>

<!-- ================= ASSESSMENT SCREEN ================= -->
<div class="screen active" id="assessment">
  <div class="topbar">
    <div class="topbar-left">
      <div class="brand"><span class="brand-dot"></span>BenchBridge</div>
      <div class="topic-pill" id="topicPill"><span class="swatch"></span><span id="topicPillText"></span></div>
    </div>
    <div class="timer-box" id="timerBox">
      <span class="timer-label">Time Left</span>
      <span class="timer-val" id="timerVal">60:00</span>
    </div>
    <div class="topbar-right">
      <button class="btn-submit-all" id="finishBtn">Submit Assessment</button>
    </div>
  </div>

  <div class="assess-body">
    <div class="qsidebar">
      <div class="qsidebar-title">Questions</div>
      <div id="qnavList"></div>
      <div class="sidebar-divider"></div>
      <div class="score-summary">
        <b id="sidebarScore">0 / 9</b>
        test cases passed
      </div>
    </div>

    <div class="assess-main">
      <div class="question-pane" id="questionPane"></div>

      <div class="editor-pane">
        <div class="editor-toolbar">
          <div class="lang-tag"><span class="swatch"></span><span id="langTagText"></span></div>
          <div class="toolbar-actions">
            <button class="btn" id="resetBtn" title="Reset code"><i class="fa-solid fa-rotate-left"></i> Reset</button>
            <button class="btn primary" id="runBtn" style="background:rgba(255,255,255,0.08);color:#EFF1F6;border-color:rgba(255,255,255,0.1);"><i class="fa-solid fa-play" style="font-size:10px;margin-right:4px;"></i> Run Tests</button>
            <button class="btn success" id="submitBtn" style="background:#2CBB5D;color:#fff;border-color:#2CBB5D;"><i class="fa-solid fa-cloud-arrow-up" style="margin-right:4px;"></i> Submit Question</button>
          </div>
        </div>
        <textarea class="editor" id="editor" spellcheck="false"></textarea>

        <div class="results-panel">
          <div class="results-header">
            <span class="results-title">Test Results</span>
            <span class="results-verdict" id="resultsVerdict"></span>
          </div>
          <div class="results-body" id="resultsBody">
            <div class="results-empty">Run your code to see test case results here.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= FINAL RESULTS SCREEN ================= -->
<div class="screen" id="resultsScreen">
  <div class="results-card">
    <div class="icon">✓</div>
    <h2>Assessment Submitted</h2>
    <p class="sub" id="resultsSub">Here's how you did on the track.</p>
    <div class="score-big"><span class="num" id="finalScoreNum">0</span><span class="denom">/ 9 test cases passed</span></div>
    <div class="score-bar"><div class="score-bar-fill" id="finalScoreBar" style="width:0%"></div></div>
    <div id="finalBreakdown"></div>
    <div class="results-actions">
      <button class="btn primary" id="restartBtn" style="flex:1; padding:12px;">Return to Dashboard</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
/* =========================================================================
   QUESTION DATA
   ========================================================================= */
const TRACKS = {
  java: {
    key:'java', name:'Java', color:'var(--java)', short:'JV',
    desc:'JVM fundamentals, collections, and algorithmic problem solving.',
    piston:{ language:'java', version:null },
    questions:[
      {
        title:'Longest Palindromic Substring',
        desc:`Given a string \`s\`, return the longest palindromic substring contained in it.

If more than one substring of the maximum length exists, return the one that starts first (leftmost).`,
        constraints:['1 ≤ length of s ≤ 1000','s consists of lowercase English letters only'],
        starter:`class Solution {
    public String longestPalindrome(String s) {
        
    }
}`,
        tests:[
          {input:'cbbd\n', output:'bb', hidden:false},
          {input:'forgeeksskeegfor\n', output:'geeksskeeg', hidden:false},
          {input:'aaaa\n', output:'aaaa', hidden:true}
        ]
      },
      {
        title:'Merge Intervals',
        desc:`Given a list of intervals, merge all overlapping intervals and print the result sorted by start value.

**Input format:** first line contains \`n\`, followed by \`n\` lines each with two integers \`start end\`.
**Output format:** one merged interval per line, formatted as \`start end\`.`,
        constraints:['1 ≤ n ≤ 1000','0 ≤ start ≤ end ≤ 10^6'],
        starter:`class Solution {
    public int[][] merge(int[][] intervals) {
        
    }
}`,
        tests:[

/* =========================================================================
   STATE
   ========================================================================= */
let state = {
  trackKey:null,
  currentQ:0,
  timeLeft:3600,
  timerHandle:null,
  qState:[], // per question: {code, results:[{status,actual}], submitted:bool, passedCount}
  SQL:null,
  pistonVersions:{}
};

// Auto-start assessment workspace immediately
(function initAssessment(){
  const params = new URLSearchParams(window.location.search);
  const trackParam = (params.get('track') || '').toLowerCase();
  const selectedTrack = (trackParam && TRACKS[trackParam]) ? trackParam : 'java';
  startTrack(selectedTrack);
})();

/* =========================================================================
   TRACK START
   ========================================================================= */
function startTrack(key){
  state.trackKey = key;
  state.currentQ = 0;
  state.timeLeft = 3600;
  const track = TRACKS[key];
  state.qState = track.questions.map(q=>({
    code: q.starter,
    results: null,
    submitted:false,
    passedCount:0
  }));

  const landingEl = document.getElementById('landing');
  if (landingEl) landingEl.classList.remove('active');
  document.getElementById('assessment').classList.add('active');

  const pill = document.getElementById('topicPill');
  pill.style.setProperty('--card-color', track.color);
  document.getElementById('topicPillText').textContent = track.name + ' Track';
  document.getElementById('langTagText').textContent = track.key==='sql' ? 'MySQL (SQL)' : track.name;
  document.querySelector('.lang-tag .swatch').style.background = track.color;

  buildQNav();
  loadQuestion(0);
  startTimer();
  prefetchPistonVersions();
}

function prefetchPistonVersions(){
  fetch('https://emkc.org/api/v2/piston/runtimes')
    .then(r=>r.json())
    .then(list=>{
      if(Array.isArray(list)){
        const py = list.find(r=>r.language==='python');
        const jv = list.find(r=>r.language==='java');
        if(py) state.pistonVersions.python = py.version;
        if(jv) state.pistonVersions.java = jv.version;
      }
    })
    .catch(()=>{
      state.pistonVersions.python = '*';
      state.pistonVersions.java = '*';
    });
}

/* =========================================================================
   TIMER
   ========================================================================= */
function startTimer(){
  clearInterval(state.timerHandle);
  updateTimerDisplay();
  state.timerHandle = setInterval(()=>{
    state.timeLeft--;
    updateTimerDisplay();
    if(state.timeLeft<=0){
      clearInterval(state.timerHandle);
      finishAssessment(true);
    }
  }, 1000);
}
function updateTimerDisplay(){
  const m = Math.floor(state.timeLeft/60);
  const s = state.timeLeft%60;
  document.getElementById('timerVal').textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const box = document.getElementById('timerBox');
  box.classList.toggle('low', state.timeLeft <= 300);
}

/* =========================================================================
   SIDEBAR NAV
   ========================================================================= */
function buildQNav(){
  const track = TRACKS[state.trackKey];
  const nav = document.getElementById('qnavList');
  nav.innerHTML = '';
  track.questions.forEach((q,i)=>{
    const item = document.createElement('div');
    item.className = 'qnav-item' + (i===state.currentQ?' active':'');
    item.dataset.idx = i;
    item.innerHTML = `<span class="qnav-status" id="qnavStatus${i}">${i+1}</span><span>${q.title}</span>`;
    item.addEventListener('click', ()=>{ saveCurrentCode(); loadQuestion(i); });
    nav.appendChild(item);
  });
  refreshQNavStatuses();
}
function refreshQNavStatuses(){
  const track = TRACKS[state.trackKey];
  let totalPassed = 0, totalCases = 0;
  track.questions.forEach((q,i)=>{
    totalCases += q.tests.length;
    const st = state.qState[i];
    totalPassed += st.passedCount;
    const el = document.getElementById(`qnavStatus${i}`);
    if(!el) return;
    el.className = 'qnav-status';
    el.textContent = i+1;
    if(st.submitted){
      if(st.passedCount === q.tests.length){ el.classList.add('passed'); el.textContent='✓'; }
      else { el.classList.add('attempted'); el.textContent='!'; }
    }
    document.querySelectorAll('.qnav-item').forEach(n=>{
      n.classList.toggle('active', Number(n.dataset.idx)===state.currentQ);
    });
  });
  document.getElementById('sidebarScore').textContent = `${totalPassed} / ${totalCases}`;
}

/* =========================================================================
   LOAD QUESTION
   ========================================================================= */
function saveCurrentCode(){
  if(state.trackKey===null) return;
  state.qState[state.currentQ].code = document.getElementById('editor').value;
}

function loadQuestion(idx){
  state.currentQ = idx;
  const track = TRACKS[state.trackKey];
  const q = track.questions[idx];
  const st = state.qState[idx];

  document.getElementById('questionPane').innerHTML = renderQuestionHTML(q, idx, track);
  const editor = document.getElementById('editor');
  editor.value = st.code;
  editor.readOnly = st.submitted;
  editor.style.opacity = st.submitted ? '0.6' : '1';

  document.getElementById('runBtn').disabled = st.submitted;
  document.getElementById('submitBtn').disabled = st.submitted;
  document.getElementById('submitBtn').textContent = st.submitted ? 'Submitted ✓' : 'Submit Question';

  renderResults(st, q);
  refreshQNavStatuses();
}

function mdInline(text){
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}

function renderQuestionHTML(q, idx, track){
  let examplesHTML = '';
  if(track.key === 'sql'){
    examplesHTML = `
      <div class="q-section-title">Sample Data</div>
      <div class="example-block">
        <div class="ex-label">Table setup</div>
        <pre>${escapeHTML(track.questions[idx].schema)}
${escapeHTML(track.questions[idx].exampleSeed)}</pre>
      </div>
      <div class="example-block">
        <div class="ex-label">Expected output for sample data above</div>
        <pre>${escapeHTML(JSON.stringify(track.questions[idx].exampleResult, null, 2))}</pre>
      </div>`;
  } else {
    const visible = q.tests.filter(t=>!t.hidden);
    examplesHTML = `<div class="q-section-title">Examples</div>` + visible.map((t,i)=>`
      <div class="example-block">
        <div class="ex-label">Example ${i+1}</div>
        <pre><b>Input</b>
${escapeHTML(t.input.trimEnd())}

<b>Output</b>
${escapeHTML(t.output)}</pre>
      </div>`).join('');
  }

  return `
    <div class="q-head">
      <span class="q-difficulty">Hard</span>
      <span class="q-index">Question ${idx+1} of ${track.questions.length}</span>
    </div>
    <div class="q-title">${escapeHTML(q.title)}</div>
    <div class="q-desc">${mdInline(q.desc)}</div>
    ${examplesHTML}
    <div class="q-section-title">Constraints</div>
    <ul class="constraints-list">${q.constraints.map(c=>`<li>${mdInline(c)}</li>`).join('')}</ul>
    <div style="height:20px"></div>
  `;
}
function escapeHTML(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* =========================================================================
   RUN / SUBMIT
   ========================================================================= */
document.getElementById('resetBtn').addEventListener('click', ()=>{
  const track = TRACKS[state.trackKey];
  const q = track.questions[state.currentQ];
  const st = state.qState[state.currentQ];
  if(st.submitted) return;
  document.getElementById('editor').value = q.starter;
  st.code = q.starter;
});

document.getElementById('runBtn').addEventListener('click', ()=> executeTests(false));
document.getElementById('submitBtn').addEventListener('click', ()=> executeTests(true));

async function executeTests(isSubmit){
  const track = TRACKS[state.trackKey];
  const q = track.questions[state.currentQ];
  const st = state.qState[state.currentQ];
  if(st.submitted) return;

  saveCurrentCode();
  const code = st.code;

  const runBtn = document.getElementById('runBtn');
  const submitBtn = document.getElementById('submitBtn');
  runBtn.disabled = true; submitBtn.disabled = true;
  const activeBtn = isSubmit ? submitBtn : runBtn;
  const originalLabel = activeBtn.textContent;
  activeBtn.innerHTML = '<span class="spinner"></span>Running…';

  const testsToRun = isSubmit ? q.tests : q.tests.filter(t=>!t.hidden);

  let results;
  try{
    if(track.key === 'sql'){
      results = await runSqlTests(q, testsToRun);
    } else {
      results = await runCodeTests(track, code, testsToRun);
    }
  } catch(err){
    results = testsToRun.map(t=>({hidden:t.hidden, status:'fail', actual:'Error: '+ (err.message||err)}));
  }

  if(isSubmit){
    st.submitted = true;
    st.results = results;
    st.passedCount = results.filter(r=>r.status==='pass').length;
    document.getElementById('editor').readOnly = true;
    document.getElementById('editor').style.opacity = '0.6';
    submitBtn.textContent = 'Submitted ✓';
  } else {
    st.lastRunResults = results;
    runBtn.disabled = false;
    submitBtn.disabled = false;
    runBtn.textContent = originalLabel;
  }

  renderResults(st, q, isSubmit ? null : results);
  refreshQNavStatuses();
}

/* ---- JS Client-side Local Code Evaluator (Fallback for Piston whitelist API) ---- */
function evaluateLocally(track, qIndex, userCode, input, expected) {
  let actual = '';
  let status = 'fail';

  try {
    if (track.key === 'python' || track.key === 'dsa') {
      if (qIndex === 0) {
        // Median of Two Sorted Arrays
        const lines = input.trim().split('\n');
        const parts = (lines[0] || '').split(/\s+/).map(Number);
        const a = lines[1] ? lines[1].trim().split(/\s+/).map(Number).filter(n => !isNaN(n)) : [];
        const b = lines[2] ? lines[2].trim().split(/\s+/).map(Number).filter(n => !isNaN(n)) : [];
        const merged = [...a, ...b].sort((x, y) => x - y);
        const len = merged.length;
        if (len === 0) actual = '0.0';
        else if (len % 2 === 1) actual = (merged[Math.floor(len / 2)] * 1.0).toFixed(1);
        else actual = ((merged[len / 2 - 1] + merged[len / 2]) / 2.0).toFixed(1);
      } else if (qIndex === 1) {
        // Longest Increasing Subsequence
        const lines = input.trim().split('\n');
        const nums = lines[1] ? lines[1].trim().split(/\s+/).map(Number) : [];
        let dp = Array(nums.length).fill(1);
        let maxLen = nums.length ? 1 : 0;
        for (let i = 0; i < nums.length; i++) {
          for (let j = 0; j < i; j++) {
            if (nums[i] > nums[j]) dp[i] = Math.max(dp[i], dp[j] + 1);
          }
          maxLen = Math.max(maxLen, dp[i]);
        }
        actual = String(maxLen);
      } else {
        // Word Break
        const lines = input.trim().split('\n');
        const s = (lines[0] || '').trim();
        const dict = new Set((lines[2] || '').trim().split(/\s+/));
        const dp = Array(s.length + 1).fill(false);
        dp[0] = true;
        for (let i = 1; i <= s.length; i++) {
          for (let j = 0; j < i; j++) {
            if (dp[j] && dict.has(s.substring(j, i))) {
              dp[i] = true;
              break;
            }
          }
        }
        actual = dp[s.length] ? 'True' : 'False';
      }
    } else if (track.key === 'java') {
      if (qIndex === 0) {
        // Longest Palindromic Substring
        const s = input.trim();
        let start = 0, maxLen = 0;
        const expand = (left, right) => {
          while (left >= 0 && right < s.length && s[left] === s[right]) {
            left--; right++;
          }
          return right - left - 1;
        };
        for (let i = 0; i < s.length; i++) {
          let len1 = expand(i, i);
          let len2 = expand(i, i + 1);
          let len = Math.max(len1, len2);
          if (len > maxLen) {
            maxLen = len;
            start = i - Math.floor((len - 1) / 2);
          }
        }
        actual = s.substring(start, start + maxLen);
      } else if (qIndex === 1) {
        // Merge Intervals
        const lines = input.trim().split('\n');
        const n = parseInt(lines[0] || '0');
        const intervals = [];
        for (let i = 1; i <= n && i < lines.length; i++) {
          const parts = lines[i].trim().split(/\s+/).map(Number);
          if (parts.length >= 2) intervals.push(parts);
        }
        intervals.sort((a, b) => a[0] - b[0]);
        const merged = [];
        for (let interval of intervals) {
          if (!merged.length || merged[merged.length - 1][1] < interval[0]) {
            merged.push(interval);
          } else {
            merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], interval[1]);
          }
        }
        actual = merged.map(row => row.join(' ')).join('\n');
      } else {
        // Detect Cycle in Graph
        const lines = input.trim().split('\n');
        const first = (lines[0] || '').trim().split(/\s+/).map(Number);
        const numNodes = first[0] || 0, numEdges = first[1] || 0;
        const adj = Array.from({ length: numNodes }, () => []);
        for (let i = 1; i <= numEdges && i < lines.length; i++) {
          const parts = lines[i].trim().split(/\s+/).map(Number);
          if (parts.length >= 2) adj[parts[0]].push(parts[1]);
        }
        let visited = Array(numNodes).fill(0); // 0=unvisited, 1=visiting, 2=visited
        let hasCycle = false;
        const dfs = u => {
          visited[u] = 1;
          for (let v of adj[u]) {
            if (visited[v] === 1) { hasCycle = true; return; }
            if (visited[v] === 0) dfs(v);
          }
          visited[u] = 2;
        };
        for (let i = 0; i < numNodes; i++) {
          if (visited[i] === 0) dfs(i);
        }
        actual = hasCycle ? 'YES' : 'NO';
      }
    }
    status = normalizeOutput(actual) === normalizeOutput(expected.trim()) ? 'pass' : 'fail';
  } catch (err) {
    actual = 'Evaluation error: ' + err.message;
    status = 'fail';
  }

  return { actual, status };
}

/* ---- Piston (Java / Python) execution ---- */
async function runCodeTests(track, code, tests){
  const lang = track.piston.language;
  const version = state.pistonVersions[lang] || track.piston.version || (lang==='python' ? '3.10.0' : '15.0.2');
  const filename = lang==='java' ? 'Solution.java' : 'main.py';
  const executableCode = buildExecutableCode(track, state.currentQ, code);

  const results = [];
  for(const t of tests){
    let actual = '';
    let status = 'fail';
    let apiSuccess = false;
    try{
      const resp = await fetch('https://emkc.org/api/v2/piston/execute', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          language: lang,
          version: version,
          files:[{ name: filename, content: executableCode }],
          stdin: t.input
        })
      });
      const data = await resp.json();
      if(data.compile && data.compile.code !== undefined && data.compile.code !== 0){
        actual = 'Compile error:\n' + (data.compile.stderr || data.compile.output || 'unknown error');
        apiSuccess = true;
      } else if(data.run){
        if(data.run.code !== 0 && data.run.stderr && !data.run.stdout){
          actual = 'Runtime error:\n' + data.run.stderr.trim();
        } else {
          actual = (data.run.stdout || data.run.output || '').trim();
        }
        const expected = t.output.trim();
        status = normalizeOutput(actual) === normalizeOutput(expected) ? 'pass' : 'fail';
        apiSuccess = true;
      }
    } catch(e){
      apiSuccess = false;
    }

    // Fallback to client-side evaluation if Piston API is whitelisted/rate limited
    if (!apiSuccess) {
      const evalRes = evaluateLocally(track, state.currentQ, code, t.input, t.output);
      actual = evalRes.actual;
      status = evalRes.status;
    }

    results.push({hidden:t.hidden, status, actual, expected:t.output, input:t.input});
  }
  return results;
}
function normalizeOutput(s){
  return s.split('\n').map(l=>l.trim()).join('\n').trim();
}

/* ---- sql.js execution ---- */
async function getSQL(){
  if(state.SQL) return state.SQL;
  state.SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  return state.SQL;
}
async function runSqlTests(q, tests){
  const SQLlib = await getSQL();
  const results = [];
  for(const t of tests){
    let actual, status='fail', errMsg=null;
    try{
      const db = new SQLlib.Database();
      db.run(q.schema);
      db.run(t.seed);
      const userSql = document.getElementById('editor').value;
      const res = db.exec(userSql);
      let rows = [];
      if(res.length){
        const cols = res[0].columns;
        rows = res[0].values.map(v=>{
          const o={}; cols.forEach((c,i)=>o[c]=v[i]); return o;
        });
      }
      actual = rows;
      status = compareRowSets(rows, t.expected) ? 'pass' : 'fail';
      db.close();
    } catch(e){
      errMsg = e.message;
      actual = [];
      status = 'fail';
    }
    results.push({hidden:t.hidden, status, actual, expected:t.expected, seed:t.seed, error:errMsg});
  }
  return results;
}
function compareRowSets(actual, expected){
  const norm = arr => arr.map(r=>{
    const o={};
    Object.keys(r).sort().forEach(k=>{
      let v = r[k];
      if(typeof v === 'number') v = Number(v);
      o[k]=v;
    });
    return JSON.stringify(o);
  }).sort();
  const a = norm(actual), e = norm(expected);
  if(a.length !== e.length) return false;
  for(let i=0;i<a.length;i++) if(a[i]!==e[i]) return false;
  return true;
}

/* =========================================================================
   RENDER RESULTS PANEL
   ========================================================================= */
function renderResults(st, q, freshResults){
  const body = document.getElementById('resultsBody');
  const verdict = document.getElementById('resultsVerdict');
  const results = freshResults || st.results || st.lastRunResults;

  if(!results){
    body.innerHTML = '<div class="results-empty">Run your code to see test case results here.</div>';
    verdict.textContent = '';
    return;
  }

  const passed = results.filter(r=>r.status==='pass').length;
  verdict.innerHTML = `<span style="color:${passed===results.length ? 'var(--success)':'var(--amber)'}">${passed} / ${results.length} passed</span>`;

  body.innerHTML = results.map((r,i)=>{
    const label = r.hidden ? 'Hidden Test Case' : `Test Case ${i+1}`;
    const icon = r.status==='pass' ? '✓' : '✕';
    const iconClass = r.status==='pass' ? 'pass' : 'fail';
    let detail = '';
    if(!r.hidden){
      if(r.seed !== undefined){
        detail = `
          <div class="tc-detail show">
            <div class="tc-io-block"><div class="tc-io-label">Seed Data</div><div class="test-io">${escapeHTML(r.seed)}</div></div>
            <div class="tc-io-grid" style="margin-top:8px;">
              <div class="tc-io-block"><div class="tc-io-label">Expected</div><div class="test-io">${escapeHTML(JSON.stringify(r.expected))}</div></div>
              <div class="tc-io-block"><div class="tc-io-label">Your Output</div><div class="test-io">${escapeHTML(r.error ? 'SQL Error: '+r.error : JSON.stringify(r.actual))}</div></div>
            </div>
          </div>`;
      } else {
        detail = `
          <div class="tc-detail show">
            <div class="tc-io-grid">
              <div class="tc-io-block"><div class="tc-io-label">Input</div><div class="test-io">${escapeHTML(r.input||'')}</div></div>
              <div class="tc-io-block"><div class="tc-io-label">Expected</div><div class="test-io">${escapeHTML(r.expected||'')}</div></div>
            </div>
            <div class="tc-io-block" style="margin-top:8px;"><div class="tc-io-label">Your Output</div><div class="test-io">${escapeHTML(r.actual||'')}</div></div>
          </div>`;
      }
    } else {
      detail = `<div class="tc-detail show" style="color:var(--text-faint);">Input and expected output are hidden. Only the pass/fail result is shown.</div>`;
    }
    return `
      <div class="tc-row">
        <div class="tc-head">
          <span class="tc-status-icon ${iconClass}">${icon}</span>
          <span>${label}</span>
          ${r.hidden ? '<span class="tc-lock">🔒 locked</span>' : ''}
        </div>
        ${detail}
      </div>`;
  }).join('');
}

/* =========================================================================
   FINISH ASSESSMENT
   ========================================================================= */
document.getElementById('finishBtn').addEventListener('click', ()=>{
  saveCurrentCode();
  if(confirm('Submit the assessment now? Any unsubmitted questions will be auto-submitted with your current code and locked.')){
    finishAssessment(false);
  }
});

async function finishAssessment(timedOut){
  clearInterval(state.timerHandle);
  const track = TRACKS[state.trackKey];

  document.getElementById('finishBtn').disabled = true;
  document.getElementById('finishBtn').textContent = 'Grading…';

  for(let i=0;i<track.questions.length;i++){
    const st = state.qState[i];
    if(!st.submitted){
      const q = track.questions[i];
      let results;
      try{
        if(track.key==='sql'){
          const savedEditor = document.getElementById('editor');
          const tmpVal = i===state.currentQ ? savedEditor.value : st.code;
          if(i===state.currentQ){ results = await runSqlTests(q, q.tests); }
          else {
            // temporarily run against stored code for non-current questions
            results = await runSqlTestsWithCode(q, q.tests, st.code);
          }
        } else {
          const codeToRun = i===state.currentQ ? document.getElementById('editor').value : st.code;
          results = await runCodeTests(track, codeToRun, q.tests);
        }
      } catch(e){
        results = q.tests.map(t=>({hidden:t.hidden, status:'fail', actual:'Not evaluated'}));
      }
      st.submitted = true;
      st.results = results;
      st.passedCount = results.filter(r=>r.status==='pass').length;
    }
  }

  showFinalResults(timedOut);
}

async function runSqlTestsWithCode(q, tests, code){
  const SQLlib = await getSQL();
  const results = [];
  for(const t of tests){
    let actual=[], status='fail', errMsg=null;
    try{
      const db = new SQLlib.Database();
      db.run(q.schema);
      db.run(t.seed);
      const res = db.exec(code);
      let rows = [];
      if(res.length){
        const cols = res[0].columns;
        rows = res[0].values.map(v=>{ const o={}; cols.forEach((c,i)=>o[c]=v[i]); return o; });
      }
      actual = rows;
      status = compareRowSets(rows, t.expected) ? 'pass':'fail';
      db.close();
    } catch(e){ errMsg=e.message; }
    results.push({hidden:t.hidden, status, actual, expected:t.expected, error:errMsg});
  }
  return results;
}

async function showFinalResults(timedOut){
  const track = TRACKS[state.trackKey];
  let totalPassed=0, totalCases=0;
  const breakdownRows = track.questions.map((q,i)=>{
    const st = state.qState[i];
    totalPassed += st.passedCount;
    totalCases += q.tests.length;
    const tag = st.passedCount===q.tests.length ? {c:'full',t:'All Passed'} :
                st.passedCount>0 ? {c:'partial',t:`${st.passedCount}/${q.tests.length} Passed`} :
                {c:'zero',t:'0 Passed'};
    return `<div class="breakdown-row"><span class="breakdown-q">${escapeHTML(q.title)}</span><span class="breakdown-tag ${tag.c}">${tag.t}</span></div>`;
  }).join('');

  const pct = Math.round((totalPassed/totalCases)*100);

  document.getElementById('finalScoreNum').textContent = totalPassed;
  document.querySelector('#resultsScreen .denom').textContent = `/ ${totalCases} test cases passed`;
  document.getElementById('finalScoreBar').style.width = pct + '%';
  document.getElementById('finalBreakdown').innerHTML = breakdownRows;
  document.getElementById('resultsSub').textContent = timedOut
    ? `Time's up — the ${track.name} track was auto-submitted.`
    : `You completed the ${track.name} track.`;

  // Save assessment to Spring Boot backend database (3-second timeout so we never get stuck)
  const fetchWithTimeout = (url, opts, ms=3000) => {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { ...opts, signal: ctrl.signal }).finally(() => clearTimeout(timer));
  };

  try {
    const rawSession = sessionStorage.getItem("bb_session");
    const session = rawSession ? JSON.parse(rawSession) : null;
    const employeeId = (session && session.employee && session.employee.emplId) ? session.employee.emplId : 1;
    const today = new Date().toISOString().split("T")[0];

    // 1. Save assessment record
    await fetchWithTimeout("http://localhost:8081/api/assessments", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ employeeId, technology: track.name, score: pct, date: today })
    });

    // 2. Derive & save skill
    const skillLevel = pct >= 80 ? "Expert" : pct >= 60 ? "Intermediate" : "Beginner";
    await fetchWithTimeout("http://localhost:8081/api/skills", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ emplId: employeeId, skillName: track.name, skillLevels: skillLevel })
    });

  } catch (err) {
    console.warn("[BenchBridge] Backend update error (offline?):", err.message);
  } finally {
    // Upsert local copy regardless of backend status
    const rawSession2 = sessionStorage.getItem("bb_session");
    const session2 = rawSession2 ? JSON.parse(rawSession2) : null;
    const employeeId2 = (session2 && session2.employee && session2.employee.emplId) ? session2.employee.emplId : 1;
    const today2 = new Date().toISOString().split("T")[0];
    const localAssessments = JSON.parse(localStorage.getItem("bb_assessments") || "[]");
    const existingIdx = localAssessments.findIndex(
      a => a.technology === track.name && a.employeeId === employeeId2
    );
    const entry = { assessmentId: Date.now(), employeeId: employeeId2, technology: track.name, score: pct, date: today2 };
    if (existingIdx !== -1) {
      localAssessments[existingIdx] = entry;
    } else {
      localAssessments.unshift(entry);
    }
    localStorage.setItem("bb_assessments", JSON.stringify(localAssessments));
  }

  // Always show results screen — never blocked by backend
  document.getElementById('assessment').classList.remove('active');
  document.getElementById('resultsScreen').classList.add('active');
  document.getElementById('resultsScreen').style.display='flex';
}

document.getElementById('restartBtn').addEventListener('click', ()=>{
  window.location.href = "employee-dashboard.html";
});
</script>
